spring:
  application:
    name: moa
  datasource:
    url: jdbc:h2:mem:moa;MODE=MySQL
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    # @Transactional이 끝난 뒤에도 영속성 컨텍스트를 뷰까지 유지하지 않도록 끔 (DB 커넥션 조기 반환)
    open-in-view: false # OSIV 비활성화
  h2:
    console:
      enabled: true

  # application-local.yml
  profiles:
    active: local

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 3600000   # 1시간 (ms)